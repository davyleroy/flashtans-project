apiVersion: v1
kind: Service
metadata:
  name: flashtans-app
  namespace: flashtans
spec:
  # Public IP on AKS. Minikube has no cloud load balancer: use NodePort there
  # (or run `minikube tunnel`).
  type: LoadBalancer
  selector:
    app: flashtans-app
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
