apiVersion: v1
kind: Service
metadata:
  name: mysql-headless
  namespace: flashtans
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
    - name: group-replication
      port: 33061
      targetPort: 33061
