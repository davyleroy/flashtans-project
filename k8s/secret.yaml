# DB credentials consumed by the MySQL StatefulSet and the app Deployment via
# secretKeyRef. Replace CHANGE_ME before the first apply: MySQL stores the
# passwords in its PVCs on first boot, so later changes here won't take effect.
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: flashtans
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: CHANGE_ME
  MYSQL_DATABASE: flash_tans_db
  MYSQL_USER: flashtans
  MYSQL_PASSWORD: CHANGE_ME
