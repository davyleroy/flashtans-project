# docker-compose-swarm.yml — Docker Swarm stack on Azure (Part 4)
# Create the secrets on the manager first, then deploy (see README):
#   docker stack deploy -c docker-compose-swarm.yml group-kane-flashtans
services:

  app:
    image: htugume/kane-flashtans-app:latest

    ports:
      - "3000:3000"

    environment:
      DB_HOST: mysql
      DB_USER: ${DB_USER:-flashtans}
      DB_PASSWORD_FILE: /run/secrets/db_password
      DB_NAME: ${DB_NAME:-flash_tans_db}
      DB_PORT: "3306"
      PORT: "3000"

    secrets:
      - db_password

    networks:
      - flashtans-network

    deploy:
      replicas: 3

      placement:
        max_replicas_per_node: 1

      restart_policy:
        condition: on-failure
        delay: 5s

      update_config:
        parallelism: 1
        delay: 10s

  mysql:
    image: mysql:8.0

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - flashtans-network

    deploy:
      replicas: 1

      placement:
        constraints:
          - node.hostname == swarm-db

      restart_policy:
        condition: on-failure

    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MYSQL_DATABASE: ${DB_NAME:-flash_tans_db}
      MYSQL_USER: ${DB_USER:-flashtans}
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_root_password
      - db_password
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$$(cat /run/secrets/db_password)" mysql --protocol=TCP -h 127.0.0.1 -u "$$MYSQL_USER" -D "$$MYSQL_DATABASE" -e 'SELECT 1'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data:

networks:
  flashtans-network:
    driver: overlay

secrets:
  db_root_password:
    external: true
  db_password:
    external: true
