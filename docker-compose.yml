# docker-compose.yml — Swarm stack: docker stack deploy -c docker-compose.yml group-kane-flashtans
services:
  app:
    # Use the image you pushed to your registry
    image: ${APP_IMAGE:-sifen23/kane-flashtans-app:latest}
    build:
      context: ./flashtans-app
    ports:
      # Published on every node by the routing mesh; swarm-lb forwards port 80 here.
      - "80:3000"
    networks:
      - flashtans-network
    environment:
      DB_HOST: mysql
      DB_USER: ${DB_USER:-flashtans}
      DB_PASSWORD_FILE: /run/secrets/db_password
      DB_NAME: ${DB_NAME:-flash_tans_db}
      DB_PORT: "3306"
      PORT: "3000"
    secrets:
      - db_password
    deploy:
      replicas: 2
      placement:
        constraints:
          - node.hostname != swarm-db
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        order: start-first
      rollback_config:
        parallelism: 1

  mysql:
    image: mysql:8.0
    networks:
      - flashtans-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == swarm-db
      restart_policy:
        condition: on-failure
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MYSQL_DATABASE: ${DB_NAME:-flash_tans_db}
      MYSQL_USER: ${DB_USER:-flashtans}
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_root_password
      - db_password
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$$(cat /run/secrets/db_password)" mysql --protocol=TCP -h 127.0.0.1 -u "$$MYSQL_USER" -D "$$MYSQL_DATABASE" -e 'SELECT 1'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data:

networks:
  flashtans-network:
    driver: overlay

secrets:
  db_root_password:
    external: true
  db_password:
    external: true
